<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BrightGrid Energy | One-Time Payment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">BrightGrid</div>
    <nav class="mega" aria-label="Main"><a href="index.html">Home</a><a href="billing.html">Account Center</a></nav>
  </header>
  <div class="layout">
    <aside><a href="#">Payment locations</a><a href="#">Pay by phone</a></aside>
    <main>
      <h2>One-Time Payment</h2>
      <form onsubmit="event.preventDefault(); document.getElementById('done').hidden = false;">
        <p><label for="amt">Payment amount</label><br /><input id="amt" name="amount" value="84.12" /></p>
        <p><label for="cc">Card number</label><br /><input id="cc" name="cardnumber" autocomplete="cc-number" /></p>
        <p><label for="exp">Expiration (MM/YY)</label><br /><input id="exp" name="exp" autocomplete="cc-exp" /></p>
        <p><label for="cvv">Security code</label><br /><input id="cvv" name="cvv" autocomplete="cc-csc" /></p>
        <button class="small-btn" type="submit">Submit payment</button>
      </form>
      <p id="done" hidden><b>Payment submitted. Confirmation #BG-20491.</b></p>
    </main>
    <aside><div class="promo">Pay with AutoPay for a $2 credit.</div></aside>
  </div>
</body>
</html>
